<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SignalMap 表示</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%;
  background: #1a202c; color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size: 16px; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

/* ヘッダー */
#header {
  background: #2d3748; padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #4a5568; flex-shrink: 0;
}
#header h1 { font-size: 16px; font-weight: 700; color: #90cdf4; }
.icon-btn {
  background: none; border: none; color: #90cdf4;
  font-size: 20px; cursor: pointer; padding: 4px 8px;
  border-radius: 6px; touch-action: manipulation;
}
.icon-btn:active { background: rgba(144,205,244,0.15); }

/* タブ */
#tabs { display: flex; background: #2d3748; border-bottom: 2px solid #4a5568; flex-shrink: 0; }
.tab-btn {
  flex: 1; padding: 8px 0; background: none; border: none;
  color: #718096; font-size: 14px; font-weight: 700;
  cursor: pointer; touch-action: manipulation;
  border-bottom: 2px solid transparent; margin-bottom: -2px;
}
.tab-btn.active { color: #90cdf4; border-bottom-color: #90cdf4; }

/* タブコンテンツ */
.tab-pane { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; }
.tab-pane.hidden { display: none; }

/* ========== 一覧タブ ========== */
#filter-panel {
  background: #2d3748; padding: 8px 12px;
  border-bottom: 1px solid #4a5568; flex-shrink: 0;
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
select {
  background: #4a5568; border: 1px solid transparent; border-radius: 8px;
  color: #e2e8f0; padding: 6px 10px; font-size: 13px;
  cursor: pointer; outline: none; touch-action: manipulation;
  -webkit-appearance: auto;
}
select:focus { border-color: #63b3ed; }
input[type="date"] {
  background: #4a5568; border: 1px solid transparent; border-radius: 8px;
  color: #e2e8f0; padding: 6px 10px; font-size: 13px; outline: none;
  touch-action: manipulation;
}
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
.action-btn {
  border: none; border-radius: 8px; padding: 6px 12px;
  font-size: 13px; font-weight: 700; cursor: pointer; touch-action: manipulation;
}
#filter-reset { background: #4a5568; color: #e2e8f0; }
#filter-reset:active { background: #718096; }
#manage-signals-btn { background: #744210; color: #fbd38d; font-size: 15px; padding: 6px 10px; }
#manage-signals-btn:active { background: #975a16; }

#stats-bar {
  background: #1e2736; padding: 8px 12px;
  display: flex; gap: 12px; border-bottom: 1px solid #4a5568;
  flex-shrink: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.stat-chip { display: flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 13px; font-weight: 600; }
.chip-emoji { font-size: 16px; }
.chip-count { color: #a0aec0; }
#total-count { color: #90cdf4; font-size: 13px; font-weight: 700; white-space: nowrap; }

#records-section { flex: 1 1 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.record-card { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid #2d3748; gap: 10px; }
.record-card:nth-child(even) { background: #1e2736; }
.rec-state-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.rec-state-icon.red    { background: rgba(229,62,62,0.2); }
.rec-state-icon.yellow { background: rgba(214,158,46,0.2); }
.rec-state-icon.green  { background: rgba(56,161,105,0.2); }
.rec-state-icon.arrow  { background: rgba(49,130,206,0.2); }
.rec-body { flex: 1; min-width: 0; }
.rec-signal-name { font-size: 14px; font-weight: 700; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rec-meta { font-size: 12px; color: #718096; margin-top: 2px; }
.rec-right { flex-shrink: 0; text-align: right; }
.rec-duration-big { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rec-duration-big.red    { color: #fc8181; }
.rec-duration-big.yellow { color: #f6e05e; }
.rec-duration-big.green  { color: #68d391; }
.rec-duration-big.arrow  { color: #63b3ed; }
.rec-duration-unit { font-size: 11px; color: #718096; }
#records-empty { text-align: center; color: #4a5568; padding: 60px 20px; font-size: 14px; }

/* ========== タイムラインタブ ========== */
#tl-controls {
  background: #2d3748; padding: 10px 12px;
  border-bottom: 1px solid #4a5568; flex-shrink: 0;
  display: flex; gap: 8px;
}
#tl-signal { flex: 1; }
#tl-legend {
  background: #1e2736; padding: 6px 12px;
  display: flex; gap: 14px; flex-shrink: 0;
  border-bottom: 1px solid #4a5568; font-size: 12px; color: #a0aec0;
  overflow-x: auto;
}
.legend-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
#tl-body { flex: 1 1 0; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; position: relative; }
#tl-prompt, #tl-empty-msg { text-align: center; color: #4a5568; padding: 60px 20px; font-size: 14px; }
.tl-rows { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; }
.tl-row { display: flex; align-items: center; height: 26px; }
.tl-date-label { width: 52px; flex-shrink: 0; font-size: 11px; color: #718096; text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
.tl-bar-area { flex: 1; position: relative; height: 22px; background: #2d3748; border-radius: 4px; }
.tl-bar { position: absolute; height: 18px; top: 2px; border-radius: 3px; min-width: 3px; opacity: 0.9; cursor: pointer; }
.tl-bar.red    { background: #E53E3E; }
.tl-bar.yellow { background: #D69E2E; }
.tl-bar.green  { background: #38A169; }
.tl-bar.arrow  { background: #3182CE; }
.tl-grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: #4a5568; pointer-events: none; }
.tl-hour-label { position: absolute; top: 0; font-size: 10px; color: #718096; transform: translateX(-50%); white-space: nowrap; }
.tl-now-bar-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #fc8181; opacity: 0.8; border-radius: 1px; pointer-events: none; z-index: 4; }
#tl-time-axis { position: sticky; top: 0; z-index: 10; background: #1a202c; border-bottom: 1px solid #4a5568; height: 26px; display: flex; align-items: flex-end; padding-bottom: 3px; }
.tl-axis-label-area { flex: 1; position: relative; height: 22px; }
.tl-axis-date-pad { width: 52px; flex-shrink: 0; }

/* ========== モーダル ========== */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  align-items: center; justify-content: center;
  z-index: 9000; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #2d3748; border-radius: 16px; padding: 24px;
  width: 100%; max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  max-height: 80vh; display: flex; flex-direction: column;
}
.modal-box h2 { font-size: 18px; color: #90cdf4; margin-bottom: 16px; flex-shrink: 0; }
.modal-box p  { font-size: 14px; color: #a0aec0; margin-bottom: 16px; flex-shrink: 0; }
.modal-scroll { flex: 1 1 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 12px; }
.modal-actions { display: flex; gap: 10px; flex-shrink: 0; }
.btn-modal {
  flex: 1; padding: 12px; border-radius: 8px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer; touch-action: manipulation;
}
.btn-primary   { background: #3182ce; color: #fff; }
.btn-secondary { background: #4a5568; color: #e2e8f0; }
.btn-danger    { background: #e53e3e; color: #fff; }

/* 信号機リスト行 */
.sig-row {
  display: flex; align-items: center; padding: 12px;
  background: #1a202c; border-radius: 8px; margin-bottom: 6px; gap: 10px;
}
.sig-row-name { flex: 1; font-weight: 600; font-size: 14px; color: #e2e8f0; }
.sig-row-count { font-size: 12px; color: #718096; flex-shrink: 0; }
.sig-row-del {
  background: #e53e3e; border: none; border-radius: 6px;
  color: #fff; padding: 7px 12px; font-size: 13px; font-weight: 700;
  cursor: pointer; touch-action: manipulation; flex-shrink: 0;
}
.sig-row-del:active { background: #c53030; filter: brightness(1.2); }

/* ポップアップ */
#tl-popup {
  display: none;
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%);
  background: #2d3748; color: #e2e8f0;
  padding: 10px 16px; border-radius: 12px;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  border: 1px solid #4a5568; z-index: 200;
  white-space: nowrap; max-width: 90vw; text-align: center;
}
#tl-popup.open { display: block; }

/* エクスポートFAB */
#export-btn {
  position: fixed; bottom: 24px; right: 20px;
  background: #38a169; color: #fff; border: none; border-radius: 16px;
  padding: 12px 20px; font-size: 14px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 16px rgba(56,161,105,0.4);
  z-index: 100; touch-action: manipulation;
  display: flex; align-items: center; gap: 6px;
}
#export-btn:active { background: #276749; }
#export-btn.hidden { display: none; }

/* トースト */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #2d3748; color: #e2e8f0;
  padding: 10px 20px; border-radius: 24px;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  z-index: 8000; opacity: 0; transition: opacity 0.3s, transform 0.3s;
  pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@supports (padding-bottom: env(safe-area-inset-bottom)) {
  #export-btn { bottom: calc(24px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>SignalMap 表示</h1>
    <a href="../collect/" style="text-decoration:none;">
      <button class="icon-btn" title="収集アプリへ">📝</button>
    </a>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="list">一覧</button>
    <button class="tab-btn"        data-tab="timeline">タイムライン</button>
  </div>

  <!-- 一覧タブ -->
  <div id="tab-list" class="tab-pane">
    <div id="filter-panel">
      <select id="filter-signal"><option value="">すべての信号機</option></select>
      <select id="filter-state">
        <option value="">すべての状態</option>
        <option value="red">🔴 赤</option>
        <option value="yellow">🟡 黄</option>
        <option value="green">🟢 青</option>
        <option value="arrow">➡️ 矢印</option>
      </select>
      <select id="filter-daytype">
        <option value="">平日・休日</option>
        <option value="weekday">平日</option>
        <option value="holiday">休日</option>
      </select>
      <input type="date" id="filter-date-from">
      <input type="date" id="filter-date-to">
      <button id="filter-reset" class="action-btn">リセット</button>
      <button id="manage-signals-btn" class="action-btn" title="信号機管理">🗑 管理</button>
    </div>
    <div id="stats-bar">
      <span id="total-count">0件</span>
      <span class="stat-chip"><span class="chip-emoji">🔴</span><span class="chip-count" id="cnt-red">0</span></span>
      <span class="stat-chip"><span class="chip-emoji">🟡</span><span class="chip-count" id="cnt-yellow">0</span></span>
      <span class="stat-chip"><span class="chip-emoji">🟢</span><span class="chip-count" id="cnt-green">0</span></span>
      <span class="stat-chip"><span class="chip-emoji">➡️</span><span class="chip-count" id="cnt-arrow">0</span></span>
      <span class="stat-chip" style="margin-left:auto;">
        <span style="color:#a0aec0;font-size:12px;" id="avg-duration"></span>
      </span>
    </div>
    <div id="records-section"><div id="records-empty">読み込み中…</div></div>
  </div>

  <!-- タイムラインタブ -->
  <div id="tab-timeline" class="tab-pane hidden">
    <div id="tl-controls">
      <select id="tl-signal"><option value="">-- 信号機を選択 --</option></select>
      <select id="tl-daytype">
        <option value="">平日・休日</option>
        <option value="weekday">平日</option>
        <option value="holiday">休日</option>
      </select>
    </div>
    <div id="tl-legend">
      <span class="legend-item"><span class="legend-dot" style="background:#E53E3E"></span>赤</span>
      <span class="legend-item"><span class="legend-dot" style="background:#D69E2E"></span>黄</span>
      <span class="legend-item"><span class="legend-dot" style="background:#38A169"></span>青</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3182CE"></span>矢印</span>
      <span class="legend-item" style="margin-left:auto;">
        <span class="legend-dot" style="background:#fc8181;"></span>現在時刻
      </span>
    </div>
    <div id="tl-body">
      <div id="tl-prompt">信号機を選択してください</div>
    </div>
  </div>
</div>

<!-- 信号機管理モーダル -->
<div id="manage-modal" class="modal-overlay">
  <div class="modal-box">
    <h2>信号機管理</h2>
    <div id="manage-list" class="modal-scroll"></div>
    <div class="modal-actions">
      <button id="manage-close" class="btn-modal btn-secondary">閉じる</button>
    </div>
  </div>
</div>

<!-- 削除確認モーダル -->
<div id="delete-modal" class="modal-overlay" style="z-index:9100;">
  <div class="modal-box">
    <h2>削除の確認</h2>
    <p id="delete-msg"></p>
    <div class="modal-actions">
      <button id="delete-cancel" class="btn-modal btn-secondary">キャンセル</button>
      <button id="delete-ok"     class="btn-modal btn-danger">削除する</button>
    </div>
  </div>
</div>

<div id="tl-popup"></div>
<button id="export-btn">📥 CSV出力</button>
<div id="toast"></div>

<script>
'use strict';

const STATE_LABELS = { red:'赤', yellow:'黄', green:'青', arrow:'矢印' };
const STATE_EMOJIS = { red:'🔴', yellow:'🟡', green:'🟢', arrow:'➡️' };

const DB_SIGNALS = localforage.createInstance({ name: 'signalmap', storeName: 'signals' });
const DB_RECORDS = localforage.createInstance({ name: 'signalmap', storeName: 'records' });

let signals = {}, allRecords = [], filtered = [];

// ─── ユーティリティ ───────────────────────────────
function formatDateTime(iso) {
  return new Date(iso).toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function formatDate(iso) { return new Date(iso).toLocaleDateString('ja-JP', { month:'2-digit', day:'2-digit' }); }
function formatTime(iso) { return new Date(iso).toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
function toDateStr(iso)  { return iso ? iso.slice(0, 10) : ''; }
function timeOfDaySecs(iso) { const d = new Date(iso); return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds(); }
function secsToHMS(s) { return [Math.floor(s/3600), Math.floor(s%3600/60), Math.floor(s%60)].map(v=>String(v).padStart(2,'0')).join(':'); }
function secsToHM(s)  { return [Math.floor(s/3600), Math.floor(s%3600/60)].map(v=>String(v).padStart(2,'0')).join(':'); }

function showToast(msg, ms=2200) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms);
}
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ─── データ読み込み ──────────────────────────────
async function loadData() {
  await DB_SIGNALS.iterate(sig => { signals[sig.id] = sig; });
  const arr = [];
  await DB_RECORDS.iterate(v => { arr.push(v); });
  arr.sort((a, b) => b.startTime.localeCompare(a.startTime));
  allRecords = arr;
  buildSignalSelects();
  applyFilters();
}

function buildSignalSelects() {
  const sigList = Object.values(signals).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  ['filter-signal', 'tl-signal'].forEach((id, i) => {
    const sel = document.getElementById(id);
    const cur = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    sigList.forEach(sig => {
      const opt = document.createElement('option');
      opt.value = sig.id; opt.textContent = sig.name;
      sel.appendChild(opt);
    });
    if (cur && signals[cur]) sel.value = cur;
  });
}

// ─── タブ切替 ────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('tab-list').classList.toggle('hidden', tab !== 'list');
    document.getElementById('tab-timeline').classList.toggle('hidden', tab !== 'timeline');
    document.getElementById('export-btn').classList.toggle('hidden', tab !== 'list');
    if (tab === 'timeline') renderTimeline();
  });
});

// ─── フィルター ──────────────────────────────────
function applyFilters() {
  const sigId   = document.getElementById('filter-signal').value;
  const state   = document.getElementById('filter-state').value;
  const dayType = document.getElementById('filter-daytype').value;
  const from    = document.getElementById('filter-date-from').value;
  const to      = document.getElementById('filter-date-to').value;
  filtered = allRecords.filter(r => {
    if (sigId   && r.signalId !== sigId)         return false;
    if (state   && r.state !== state)             return false;
    if (dayType && r.dayType !== dayType)         return false;
    if (from    && toDateStr(r.startTime) < from) return false;
    if (to      && toDateStr(r.startTime) > to)   return false;
    return true;
  });
  updateStats();
  renderList();
}

['filter-signal','filter-state','filter-daytype','filter-date-from','filter-date-to'].forEach(id => {
  document.getElementById(id).addEventListener('change', applyFilters);
});

document.getElementById('filter-reset').addEventListener('click', () => {
  document.getElementById('filter-signal').selectedIndex  = 0;
  document.getElementById('filter-state').selectedIndex   = 0;
  document.getElementById('filter-daytype').selectedIndex = 0;
  document.getElementById('filter-date-from').value = '';
  document.getElementById('filter-date-to').value   = '';
  applyFilters();
});

// ─── 統計 ────────────────────────────────────────
function updateStats() {
  const c = { red:0, yellow:0, green:0, arrow:0 };
  let tot = 0;
  filtered.forEach(r => { if (c[r.state] !== undefined) c[r.state]++; tot += r.duration||0; });
  document.getElementById('total-count').textContent  = `${filtered.length}件`;
  document.getElementById('cnt-red').textContent      = c.red;
  document.getElementById('cnt-yellow').textContent   = c.yellow;
  document.getElementById('cnt-green').textContent    = c.green;
  document.getElementById('cnt-arrow').textContent    = c.arrow;
  document.getElementById('avg-duration').textContent = filtered.length ? `平均 ${Math.round(tot/filtered.length)}秒` : '';
}

// ─── 一覧 ────────────────────────────────────────
function renderList() {
  const section = document.getElementById('records-section');
  section.innerHTML = '';
  if (!filtered.length) {
    const el = document.createElement('div');
    el.id = 'records-empty';
    el.textContent = allRecords.length ? 'フィルター結果が0件です' : '記録がありません';
    section.appendChild(el);
    return;
  }
  filtered.forEach(rec => {
    const sig  = signals[rec.signalId];
    const card = document.createElement('div');
    card.className = 'record-card';
    card.innerHTML = `
      <div class="rec-state-icon ${rec.state}">${STATE_EMOJIS[rec.state]||'?'}</div>
      <div class="rec-body">
        <div class="rec-signal-name">${sig ? sig.name : '(削除済み)'}</div>
        <div class="rec-meta">${formatDate(rec.startTime)} ${formatTime(rec.startTime)} · ${rec.dayType==='weekday'?'平日':'休日'}</div>
      </div>
      <div class="rec-right">
        <div class="rec-duration-big ${rec.state}">${rec.duration}</div>
        <div class="rec-duration-unit">秒</div>
      </div>`;
    section.appendChild(card);
  });
}

// ─── 信号機管理 ──────────────────────────────────
let deleteTargetId = null;

document.getElementById('manage-signals-btn').addEventListener('click', openManageModal);
document.getElementById('manage-close').addEventListener('click', () => closeModal('manage-modal'));
document.getElementById('delete-cancel').addEventListener('click', () => {
  closeModal('delete-modal');
  openManageModal();
});
document.getElementById('delete-ok').addEventListener('click', async () => {
  const id = deleteTargetId;
  await DB_SIGNALS.removeItem(id);
  delete signals[id];
  const toDelete = [];
  await DB_RECORDS.iterate((v, k) => { if (v.signalId === id) toDelete.push(k); });
  await Promise.all(toDelete.map(k => DB_RECORDS.removeItem(k)));
  allRecords = allRecords.filter(r => r.signalId !== id);
  closeModal('delete-modal');
  buildSignalSelects();
  applyFilters();
  showToast('削除しました');
});

function openManageModal() {
  const listEl  = document.getElementById('manage-list');
  listEl.innerHTML = '';

  const sigList = Object.values(signals).sort((a, b) => a.name.localeCompare(b.name, 'ja'));

  if (!sigList.length) {
    const msg = document.createElement('div');
    msg.style.cssText = 'text-align:center;color:#4a5568;padding:20px;font-size:14px;';
    msg.textContent = '信号機がありません';
    listEl.appendChild(msg);
  } else {
    // 記録件数を集計
    const counts = {};
    sigList.forEach(s => { counts[s.id] = 0; });
    allRecords.forEach(r => { if (counts[r.signalId] !== undefined) counts[r.signalId]++; });

    sigList.forEach(sig => {
      const row = document.createElement('div');
      row.className = 'sig-row';

      const nameEl = document.createElement('div');
      nameEl.className = 'sig-row-name';
      nameEl.textContent = sig.name;

      const countEl = document.createElement('div');
      countEl.className = 'sig-row-count';
      countEl.textContent = `${counts[sig.id]}件`;

      const delBtn = document.createElement('button');
      delBtn.className = 'sig-row-del';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', () => {
        deleteTargetId = sig.id;
        document.getElementById('delete-msg').textContent =
          `「${sig.name}」と紐付く全記録（${counts[sig.id]}件）を削除します。元に戻せません。`;
        closeModal('manage-modal');
        openModal('delete-modal');
      });

      row.appendChild(nameEl);
      row.appendChild(countEl);
      row.appendChild(delBtn);
      listEl.appendChild(row);
    });
  }
  openModal('manage-modal');
}

// ─── タイムライン ────────────────────────────────
let tlNowTimer = null;
document.getElementById('tl-signal').addEventListener('change', renderTimeline);
document.getElementById('tl-daytype').addEventListener('change', renderTimeline);

function renderTimeline() {
  const sigId   = document.getElementById('tl-signal').value;
  const dayType = document.getElementById('tl-daytype').value;
  const body    = document.getElementById('tl-body');
  if (tlNowTimer) { clearInterval(tlNowTimer); tlNowTimer = null; }

  if (!sigId) { body.innerHTML = '<div id="tl-prompt">信号機を選択してください</div>'; return; }

  let recs = allRecords.filter(r => r.signalId === sigId);
  if (dayType) recs = recs.filter(r => r.dayType === dayType);
  if (!recs.length) { body.innerHTML = '<div id="tl-empty-msg">この信号機の記録がありません</div>'; return; }

  let minSec = Infinity, maxSec = -Infinity;
  recs.forEach(r => {
    const s = timeOfDaySecs(r.startTime);
    const e = s + (r.duration || 0);
    if (s < minSec) minSec = s;
    if (e > maxSec) maxSec = e;
  });
  minSec = Math.max(0, minSec - 300);
  maxSec = Math.min(86400, maxSec + 300);
  const range = maxSec - minSec;

  const byDate = {};
  recs.forEach(r => {
    const d = toDateStr(r.startTime);
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(r);
  });
  const dates = Object.keys(byDate).sort();

  const interval = range <= 3600 ? 600 : range <= 10800 ? 1800 : 3600;

  body.innerHTML = '';

  // 時刻軸
  const axis = document.createElement('div');
  axis.id = 'tl-time-axis';
  const axisPad = document.createElement('div');
  axisPad.className = 'tl-axis-date-pad';
  const axisArea = document.createElement('div');
  axisArea.className = 'tl-axis-label-area';
  for (let t = Math.ceil(minSec/interval)*interval; t <= maxSec; t += interval) {
    const lbl = document.createElement('div');
    lbl.className = 'tl-hour-label';
    lbl.style.left = ((t-minSec)/range*100) + '%';
    lbl.textContent = secsToHM(t);
    axisArea.appendChild(lbl);
  }
  axis.appendChild(axisPad);
  axis.appendChild(axisArea);
  body.appendChild(axis);

  // データ行
  const rowsDiv = document.createElement('div');
  rowsDiv.className = 'tl-rows';

  dates.forEach(date => {
    const row = document.createElement('div');
    row.className = 'tl-row';

    const lbl = document.createElement('div');
    lbl.className = 'tl-date-label';
    lbl.textContent = date.slice(5).replace('-', '/');

    const barArea = document.createElement('div');
    barArea.className = 'tl-bar-area';

    // グリッド線
    for (let t = Math.ceil(minSec/interval)*interval; t <= maxSec; t += interval) {
      const g = document.createElement('div');
      g.className = 'tl-grid-line';
      g.style.left = ((t-minSec)/range*100) + '%';
      barArea.appendChild(g);
    }

    // バー
    byDate[date].forEach(rec => {
      const s   = timeOfDaySecs(rec.startTime);
      const bar = document.createElement('div');
      bar.className = `tl-bar ${rec.state}`;
      bar.style.left  = ((s-minSec)/range*100) + '%';
      bar.style.width = Math.max(0.3, rec.duration/range*100) + '%';
      bar.addEventListener('click', e => {
        e.stopPropagation();
        showTlPopup(`${STATE_EMOJIS[rec.state]} ${STATE_LABELS[rec.state]}　${formatTime(rec.startTime)} → ${secsToHMS(s+rec.duration)}　（${rec.duration}秒）`);
      });
      barArea.appendChild(bar);
    });

    row.appendChild(lbl);
    row.appendChild(barArea);
    rowsDiv.appendChild(row);
  });

  body.appendChild(rowsDiv);
  drawNowLines(body, minSec, range);
  tlNowTimer = setInterval(() => drawNowLines(body, minSec, range), 10000);
  body.addEventListener('click', hideTlPopup);
}

function drawNowLines(body, minSec, range) {
  body.querySelectorAll('.tl-now-bar-line, .tl-now-axis-line, .tl-now-axis-label').forEach(el => el.remove());
  const now = new Date();
  const nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
  if (nowSec < minSec || nowSec > minSec + range) return;
  const pct = (nowSec - minSec) / range * 100;

  // 軸ラベルに今の時刻
  const axisArea = body.querySelector('.tl-axis-label-area');
  if (axisArea) {
    const line = document.createElement('div');
    line.className = 'tl-now-axis-line';
    line.style.cssText = `position:absolute;top:0;bottom:0;width:2px;background:#fc8181;left:${pct}%;pointer-events:none;`;
    axisArea.appendChild(line);
    const lbl = document.createElement('div');
    lbl.className = 'tl-now-axis-label';
    lbl.style.cssText = `position:absolute;bottom:0;font-size:10px;color:#fc8181;font-weight:700;left:${pct}%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;`;
    lbl.textContent = secsToHM(nowSec);
    axisArea.appendChild(lbl);
  }

  // 各行にライン
  body.querySelectorAll('.tl-bar-area').forEach(ba => {
    const line = document.createElement('div');
    line.className = 'tl-now-bar-line';
    line.style.left = pct + '%';
    ba.appendChild(line);
  });
}

let popupTimer = null;
function showTlPopup(msg) {
  const el = document.getElementById('tl-popup');
  el.textContent = msg; el.classList.add('open');
  clearTimeout(popupTimer);
  popupTimer = setTimeout(() => el.classList.remove('open'), 3000);
}
function hideTlPopup() { document.getElementById('tl-popup').classList.remove('open'); }

// ─── CSV出力 ────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  if (!filtered.length) { showToast('エクスポートするデータがありません'); return; }
  const header = ['日時','信号機名','状態','秒数','平日/休日','開始時刻','終了時刻'];
  const rows = filtered.map(r => {
    const sig = signals[r.signalId];
    return [formatDateTime(r.startTime), sig?sig.name:'(削除済み)', STATE_LABELS[r.state]||r.state,
            r.duration, r.dayType==='weekday'?'平日':'休日', r.startTime, r.endTime]
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv  = '\uFEFF' + [header.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `signalmap_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast(`${filtered.length}件をCSVに出力しました`);
});

// ─── 起動 ───────────────────────────────────────
loadData();
</script>
