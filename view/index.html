<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SignalMap 表示</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%;
  background: #1a202c;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
  font-size: 16px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }

/* ヘッダー */
#header {
  background: #2d3748;
  padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #4a5568;
  flex-shrink: 0;
}
#header h1 { font-size: 16px; font-weight: 700; color: #90cdf4; }
.icon-btn {
  background: none; border: none; color: #90cdf4;
  font-size: 20px; cursor: pointer; padding: 4px 8px;
  border-radius: 6px; touch-action: manipulation;
}
.icon-btn:active { background: rgba(144,205,244,0.15); }

/* タブ */
#tabs {
  display: flex;
  background: #2d3748;
  border-bottom: 2px solid #4a5568;
  flex-shrink: 0;
}
.tab-btn {
  flex: 1; padding: 8px 0;
  background: none; border: none;
  color: #718096; font-size: 14px; font-weight: 700;
  cursor: pointer; touch-action: manipulation;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color 0.2s;
}
.tab-btn.active { color: #90cdf4; border-bottom-color: #90cdf4; }
.tab-btn:active { background: rgba(144,205,244,0.08); }

/* タブコンテンツ */
.tab-content { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; }
.tab-content.hidden { display: none; }

/* ========== 一覧タブ ========== */
#filter-panel {
  background: #2d3748; padding: 8px 12px;
  border-bottom: 1px solid #4a5568;
  flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
select {
  background: #4a5568; border: none; border-radius: 8px;
  color: #e2e8f0; padding: 6px 10px; font-size: 13px;
  cursor: pointer; outline: none; touch-action: manipulation;
}
#filter-date-from, #filter-date-to {
  background: #4a5568; border: none; border-radius: 8px;
  color: #e2e8f0; padding: 6px 10px; font-size: 13px; outline: none;
}
#filter-date-from::-webkit-calendar-picker-indicator,
#filter-date-to::-webkit-calendar-picker-indicator { filter: invert(1); }
#filter-reset {
  background: #e53e3e; border: none; border-radius: 8px;
  color: #fff; padding: 6px 12px; font-size: 13px; font-weight: 700;
  cursor: pointer; touch-action: manipulation;
}
#filter-reset:active { background: #c53030; }
#manage-signals-btn {
  background: #4a5568; border: none; border-radius: 8px;
  color: #e2e8f0; padding: 6px 10px; font-size: 16px;
  cursor: pointer; touch-action: manipulation; flex-shrink: 0;
}
#manage-signals-btn:active { background: #718096; }

#stats-bar {
  background: #1e2736; padding: 8px 12px;
  display: flex; gap: 12px; border-bottom: 1px solid #4a5568;
  flex-shrink: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.stat-chip { display: flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 13px; font-weight: 600; }
.stat-chip .chip-emoji { font-size: 16px; }
.stat-chip .chip-count { color: #a0aec0; }
#total-count { color: #90cdf4; font-size: 13px; font-weight: 700; white-space: nowrap; }

#records-section {
  flex: 1 1 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch; touch-action: pan-y;
}
.record-card {
  display: flex; align-items: center; padding: 10px 12px;
  border-bottom: 1px solid #2d3748; gap: 10px;
}
.record-card:nth-child(even) { background: #1e2736; }
.rec-state-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.rec-state-icon.red    { background: rgba(229,62,62,0.2); }
.rec-state-icon.yellow { background: rgba(214,158,46,0.2); }
.rec-state-icon.green  { background: rgba(56,161,105,0.2); }
.rec-state-icon.arrow  { background: rgba(49,130,206,0.2); }
.rec-body { flex: 1; min-width: 0; }
.rec-signal-name { font-size: 14px; font-weight: 700; color: #e2e8f0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rec-meta { font-size: 12px; color: #718096; margin-top: 2px; }
.rec-right { flex-shrink: 0; text-align: right; }
.rec-duration-big { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rec-duration-big.red    { color: #fc8181; }
.rec-duration-big.yellow { color: #f6e05e; }
.rec-duration-big.green  { color: #68d391; }
.rec-duration-big.arrow  { color: #63b3ed; }
.rec-duration-unit { font-size: 11px; color: #718096; }
#records-empty { text-align: center; color: #4a5568; padding: 60px 20px; font-size: 14px; }

/* ========== タイムラインタブ ========== */
#tl-controls {
  background: #2d3748; padding: 10px 12px;
  border-bottom: 1px solid #4a5568; flex-shrink: 0;
  display: flex; gap: 8px; align-items: center;
}
#tl-signal { flex: 1; }
#tl-daytype { width: 100px; }

#tl-legend {
  background: #1e2736; padding: 6px 12px;
  display: flex; gap: 14px; flex-shrink: 0;
  border-bottom: 1px solid #4a5568;
  font-size: 12px; color: #a0aec0;
  overflow-x: auto;
}
.legend-item { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

#tl-body {
  flex: 1 1 0; overflow: auto;
  -webkit-overflow-scrolling: touch; touch-action: pan-y;
  position: relative;
}
#tl-prompt, #tl-empty-msg {
  text-align: center; color: #4a5568; padding: 60px 20px; font-size: 14px;
}

/* タイムライン行 */
#tl-time-axis {
  position: sticky; top: 0; z-index: 10;
  background: #1a202c; border-bottom: 1px solid #4a5568;
  height: 26px; display: flex; align-items: flex-end;
  padding-bottom: 3px;
}
.tl-rows { display: flex; flex-direction: column; gap: 4px; padding: 8px 0; }
.tl-row { display: flex; align-items: center; height: 26px; }
.tl-date-label {
  width: 52px; flex-shrink: 0;
  font-size: 11px; color: #718096;
  text-align: right; padding-right: 8px;
  font-variant-numeric: tabular-nums;
}
.tl-bar-area {
  flex: 1; position: relative; height: 22px;
  background: #2d3748; border-radius: 4px; overflow: visible;
}
.tl-bar {
  position: absolute; height: 18px; top: 2px;
  border-radius: 3px; min-width: 3px;
  cursor: pointer; transition: opacity 0.15s;
  opacity: 0.9;
}
.tl-bar:active { opacity: 1; }
.tl-bar.red    { background: #E53E3E; }
.tl-bar.yellow { background: #D69E2E; }
.tl-bar.green  { background: #38A169; }
.tl-bar.arrow  { background: #3182CE; }
.tl-now-line {
  position: absolute; top: -26px; bottom: 0; width: 2px;
  background: #fc8181; z-index: 5; pointer-events: none;
}
.tl-now-label {
  position: absolute; top: -22px; font-size: 10px;
  color: #fc8181; font-weight: 700; white-space: nowrap;
  transform: translateX(-50%);
}
.tl-grid-line {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: #4a5568; pointer-events: none; z-index: 1;
}
.tl-hour-label {
  position: absolute; top: 0;
  font-size: 10px; color: #718096;
  transform: translateX(-50%);
  white-space: nowrap;
}

/* タップ詳細ポップアップ */
#tl-popup {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%);
  background: #2d3748; color: #e2e8f0;
  padding: 10px 16px; border-radius: 12px;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  border: 1px solid #4a5568;
  z-index: 200; pointer-events: none;
  opacity: 0; transition: opacity 0.2s;
  white-space: nowrap; max-width: 90vw;
  text-align: center;
}
#tl-popup.show { opacity: 1; }

/* エクスポートFAB */
#export-btn {
  position: fixed; bottom: 24px; right: 20px;
  background: #38a169; color: #fff; border: none; border-radius: 16px;
  padding: 12px 20px; font-size: 14px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 16px rgba(56,161,105,0.4);
  z-index: 100; touch-action: manipulation;
  display: flex; align-items: center; gap: 6px;
}
#export-btn:active { background: #276749; }
#export-btn.hidden { display: none; }

/* トースト */
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: #2d3748; color: #e2e8f0;
  padding: 10px 20px; border-radius: 24px;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  z-index: 8000; opacity: 0; transition: opacity 0.3s, transform 0.3s;
  pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@supports (padding-bottom: env(safe-area-inset-bottom)) {
  #export-btn { bottom: calc(24px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<div id="app">
  <!-- ヘッダー -->
  <div id="header">
    <h1>SignalMap 表示</h1>
    <a href="../collect/" style="text-decoration:none;">
      <button class="icon-btn" title="収集アプリへ">📝</button>
    </a>
  </div>

  <!-- タブ -->
  <div id="tabs">
    <button class="tab-btn active" data-tab="list">一覧</button>
    <button class="tab-btn"        data-tab="timeline">タイムライン</button>
  </div>

  <!-- 一覧タブ -->
  <div id="tab-list" class="tab-content">
    <div id="filter-panel">
      <select id="filter-signal"><option value="">すべての信号機</option></select>
      <select id="filter-state">
        <option value="">すべての状態</option>
        <option value="red">🔴 赤</option>
        <option value="yellow">🟡 黄</option>
        <option value="green">🟢 青</option>
        <option value="arrow">➡️ 矢印</option>
      </select>
      <select id="filter-daytype">
        <option value="">平日・休日</option>
        <option value="weekday">平日</option>
        <option value="holiday">休日</option>
      </select>
      <input type="date" id="filter-date-from">
      <input type="date" id="filter-date-to">
      <button id="filter-reset">リセット</button>
      <button id="manage-signals-btn" title="信号機管理">🗑</button>
    </div>
    <div id="stats-bar">
      <span id="total-count">0件</span>
      <span class="stat-chip"><span class="chip-emoji">🔴</span><span class="chip-count" id="cnt-red">0</span></span>
      <span class="stat-chip"><span class="chip-emoji">🟡</span><span class="chip-count" id="cnt-yellow">0</span></span>
      <span class="stat-chip"><span class="chip-emoji">🟢</span><span class="chip-count" id="cnt-green">0</span></span>
      <span class="stat-chip"><span class="chip-emoji">➡️</span><span class="chip-count" id="cnt-arrow">0</span></span>
      <span class="stat-chip" style="margin-left:auto;">
        <span style="color:#a0aec0;font-size:12px;" id="avg-duration"></span>
      </span>
    </div>
    <div id="records-section"><div id="records-empty">読み込み中…</div></div>
  </div>

  <!-- タイムラインタブ -->
  <div id="tab-timeline" class="tab-content hidden">
    <div id="tl-controls">
      <select id="tl-signal"><option value="">-- 信号機を選択 --</option></select>
      <select id="tl-daytype">
        <option value="">平日・休日</option>
        <option value="weekday">平日</option>
        <option value="holiday">休日</option>
      </select>
    </div>
    <div id="tl-legend">
      <span class="legend-item"><span class="legend-dot" style="background:#E53E3E"></span>赤</span>
      <span class="legend-item"><span class="legend-dot" style="background:#D69E2E"></span>黄</span>
      <span class="legend-item"><span class="legend-dot" style="background:#38A169"></span>青</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3182CE"></span>矢印</span>
      <span class="legend-item" style="margin-left:auto;">
        <span class="legend-dot" style="background:#fc8181;opacity:0.8;"></span>
        <span>現在時刻</span>
      </span>
    </div>
    <div id="tl-body">
      <div id="tl-prompt">信号機を選択してください</div>
    </div>
  </div>
</div>

<!-- 信号機管理モーダル -->
<div id="manage-modal" style="
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  display:flex;align-items:center;justify-content:center;
  z-index:9000;padding:20px;
" class="hidden">
  <div style="
    background:#2d3748;border-radius:16px;padding:24px;
    width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.5);
    max-height:80vh;display:flex;flex-direction:column;
  ">
    <h2 style="font-size:18px;color:#90cdf4;margin-bottom:16px;flex-shrink:0;">信号機管理</h2>
    <div id="manage-list" style="flex:1 1 0;overflow-y:auto;"></div>
    <div style="margin-top:12px;flex-shrink:0;">
      <button id="manage-close" style="
        width:100%;padding:12px;border-radius:8px;border:none;
        background:#4a5568;color:#e2e8f0;font-size:15px;font-weight:700;cursor:pointer;
      ">閉じる</button>
    </div>
  </div>
</div>

<!-- 削除確認モーダル -->
<div id="delete-modal" style="
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  display:flex;align-items:center;justify-content:center;
  z-index:9100;padding:20px;
" class="hidden">
  <div style="
    background:#2d3748;border-radius:16px;padding:24px;
    width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.5);
  ">
    <h2 style="font-size:18px;color:#90cdf4;margin-bottom:12px;">削除の確認</h2>
    <p id="delete-msg" style="color:#a0aec0;font-size:14px;margin-bottom:16px;"></p>
    <div style="display:flex;gap:10px;">
      <button id="delete-cancel" style="flex:1;padding:12px;border-radius:8px;border:none;background:#4a5568;color:#e2e8f0;font-size:15px;font-weight:700;cursor:pointer;">キャンセル</button>
      <button id="delete-ok"     style="flex:1;padding:12px;border-radius:8px;border:none;background:#e53e3e;color:#fff;font-size:15px;font-weight:700;cursor:pointer;">削除する</button>
    </div>
  </div>
</div>

<div id="tl-popup"></div>
<button id="export-btn">📥 CSV出力</button>
<div id="toast"></div>

<script>
'use strict';

const STATE_LABELS   = { red:'赤', yellow:'黄', green:'青', arrow:'矢印' };
const STATE_EMOJIS   = { red:'🔴', yellow:'🟡', green:'🟢', arrow:'➡️' };
const STATE_COLORS   = { red:'#E53E3E', yellow:'#D69E2E', green:'#38A169', arrow:'#3182CE' };

const DB_SIGNALS = localforage.createInstance({ name: 'signalmap', storeName: 'signals' });
const DB_RECORDS = localforage.createInstance({ name: 'signalmap', storeName: 'records' });

let signals    = {};
let allRecords = [];
let filtered   = [];

// =====================================================
//  ユーティリティ
// =====================================================
function formatDateTime(iso) {
  return new Date(iso).toLocaleString('ja-JP', {
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
}
function formatDate(iso) {
  return new Date(iso).toLocaleDateString('ja-JP', { month:'2-digit', day:'2-digit' });
}
function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function toDateStr(iso) { return iso ? iso.slice(0, 10) : ''; }

function timeOfDaySecs(iso) {
  const d = new Date(iso);
  return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
}
function secsToHMS(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function secsToHM(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function showToast(msg, ms = 2200) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

// =====================================================
//  データ読み込み
// =====================================================
async function loadData() {
  await DB_SIGNALS.iterate(sig => { signals[sig.id] = sig; });
  const arr = [];
  await DB_RECORDS.iterate(v => { arr.push(v); });
  arr.sort((a, b) => b.startTime.localeCompare(a.startTime));
  allRecords = arr;
  buildSignalFilters();
  applyFilters();
}

function buildSignalFilters() {
  const sigList = Object.values(signals).sort((a, b) => a.name.localeCompare(b.name, 'ja'));

  // 一覧用
  const sel1 = document.getElementById('filter-signal');
  while (sel1.options.length > 1) sel1.remove(1);
  sigList.forEach(sig => {
    const opt = document.createElement('option');
    opt.value = sig.id; opt.textContent = sig.name;
    sel1.appendChild(opt);
  });

  // タイムライン用
  const sel2 = document.getElementById('tl-signal');
  while (sel2.options.length > 1) sel2.remove(1);
  sigList.forEach(sig => {
    const opt = document.createElement('option');
    opt.value = sig.id; opt.textContent = sig.name;
    sel2.appendChild(opt);
  });
}

// =====================================================
//  タブ切替
// =====================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('tab-list').classList.toggle('hidden', tab !== 'list');
    document.getElementById('tab-timeline').classList.toggle('hidden', tab !== 'timeline');
    document.getElementById('export-btn').classList.toggle('hidden', tab !== 'list');
    if (tab === 'timeline') renderTimeline();
  });
});

// =====================================================
//  一覧：フィルター
// =====================================================
function applyFilters() {
  const sigId   = document.getElementById('filter-signal').value;
  const state   = document.getElementById('filter-state').value;
  const dayType = document.getElementById('filter-daytype').value;
  const from    = document.getElementById('filter-date-from').value;
  const to      = document.getElementById('filter-date-to').value;

  filtered = allRecords.filter(r => {
    if (sigId   && r.signalId !== sigId)              return false;
    if (state   && r.state !== state)                  return false;
    if (dayType && r.dayType !== dayType)               return false;
    if (from    && toDateStr(r.startTime) < from)      return false;
    if (to      && toDateStr(r.startTime) > to)        return false;
    return true;
  });

  updateStats();
  renderList();
}

['filter-signal','filter-state','filter-daytype','filter-date-from','filter-date-to'].forEach(id => {
  document.getElementById(id).addEventListener('change', applyFilters);
});
document.getElementById('filter-reset').addEventListener('click', () => {
  ['filter-signal','filter-state','filter-daytype'].forEach(id => {
    const el = document.getElementById(id);
    el.selectedIndex = 0;
  });
  document.getElementById('filter-date-from').value = '';
  document.getElementById('filter-date-to').value   = '';
  applyFilters();
});

// =====================================================
//  一覧：統計
// =====================================================
function updateStats() {
  const counts = { red:0, yellow:0, green:0, arrow:0 };
  let totalDur = 0;
  filtered.forEach(r => {
    if (counts[r.state] !== undefined) counts[r.state]++;
    totalDur += r.duration || 0;
  });
  document.getElementById('total-count').textContent  = `${filtered.length}件`;
  document.getElementById('cnt-red').textContent      = counts.red;
  document.getElementById('cnt-yellow').textContent   = counts.yellow;
  document.getElementById('cnt-green').textContent    = counts.green;
  document.getElementById('cnt-arrow').textContent    = counts.arrow;
  const avg = filtered.length ? Math.round(totalDur / filtered.length) : 0;
  document.getElementById('avg-duration').textContent = filtered.length ? `平均 ${avg}秒` : '';
}

// =====================================================
//  一覧：描画
// =====================================================
function renderList() {
  const section = document.getElementById('records-section');
  section.innerHTML = '';

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.id = 'records-empty';
    empty.textContent = allRecords.length ? 'フィルター結果が0件です' : '記録がありません';
    section.appendChild(empty);
    return;
  }

  filtered.forEach(rec => {
    const sig  = signals[rec.signalId];
    const card = document.createElement('div');
    card.className = 'record-card';
    card.innerHTML = `
      <div class="rec-state-icon ${rec.state}">${STATE_EMOJIS[rec.state] || '?'}</div>
      <div class="rec-body">
        <div class="rec-signal-name">${sig ? sig.name : '(削除済み)'}</div>
        <div class="rec-meta">${formatDate(rec.startTime)} ${formatTime(rec.startTime)} · ${rec.dayType === 'weekday' ? '平日' : '休日'}</div>
      </div>
      <div class="rec-right">
        <div class="rec-duration-big ${rec.state}">${rec.duration}</div>
        <div class="rec-duration-unit">秒</div>
      </div>
    `;
    section.appendChild(card);
  });
}

// =====================================================
//  タイムライン
// =====================================================
let tlNowTimer = null;

document.getElementById('tl-signal').addEventListener('change', renderTimeline);
document.getElementById('tl-daytype').addEventListener('change', renderTimeline);

function renderTimeline() {
  const sigId   = document.getElementById('tl-signal').value;
  const dayType = document.getElementById('tl-daytype').value;
  const body    = document.getElementById('tl-body');

  if (tlNowTimer) { clearInterval(tlNowTimer); tlNowTimer = null; }

  if (!sigId) {
    body.innerHTML = '<div id="tl-prompt">信号機を選択してください</div>';
    return;
  }

  let recs = allRecords.filter(r => r.signalId === sigId);
  if (dayType) recs = recs.filter(r => r.dayType === dayType);

  if (!recs.length) {
    body.innerHTML = '<div id="tl-empty-msg">この信号機の記録がありません</div>';
    return;
  }

  // --- 時間範囲を計算 ---
  let minSec = Infinity, maxSec = -Infinity;
  recs.forEach(r => {
    const s = timeOfDaySecs(r.startTime);
    const e = s + (r.duration || 0);
    if (s < minSec) minSec = s;
    if (e > maxSec) maxSec = e;
  });
  // 余白: 前後5分
  minSec = Math.max(0,     minSec - 300);
  maxSec = Math.min(86400, maxSec + 300);
  const totalSec = maxSec - minSec;

  // --- 日付ごとにグループ ---
  const byDate = {};
  recs.forEach(r => {
    const date = toDateStr(r.startTime);
    if (!byDate[date]) byDate[date] = [];
    byDate[date].push(r);
  });
  const dates = Object.keys(byDate).sort();

  // --- DOM 構築 ---
  body.innerHTML = '';

  // 時刻軸（sticky）
  const axisRow = document.createElement('div');
  axisRow.id = 'tl-time-axis';
  axisRow.style.cssText = 'position:sticky;top:0;z-index:10;background:#1a202c;border-bottom:1px solid #4a5568;height:26px;display:flex;align-items:flex-end;padding-bottom:3px;';

  const axisLabel = document.createElement('div');
  axisLabel.style.cssText = 'width:52px;flex-shrink:0;';
  axisRow.appendChild(axisLabel);

  const axisBarArea = document.createElement('div');
  axisBarArea.style.cssText = 'flex:1;position:relative;height:22px;';

  // グリッド線・時刻ラベル
  const interval = totalSec <= 3600 ? 600 : totalSec <= 10800 ? 1800 : 3600; // 10分/30分/1時間
  for (let t = Math.ceil(minSec / interval) * interval; t <= maxSec; t += interval) {
    const pct = (t - minSec) / totalSec * 100;
    const label = document.createElement('div');
    label.className = 'tl-hour-label';
    label.style.left = pct + '%';
    label.textContent = secsToHM(t);
    axisBarArea.appendChild(label);
  }
  axisRow.appendChild(axisBarArea);
  body.appendChild(axisRow);

  // データ行
  const rowsDiv = document.createElement('div');
  rowsDiv.className = 'tl-rows';

  dates.forEach(date => {
    const row = document.createElement('div');
    row.className = 'tl-row';

    const label = document.createElement('div');
    label.className = 'tl-date-label';
    label.textContent = date.slice(5).replace('-', '/'); // MM/DD

    const barArea = document.createElement('div');
    barArea.className = 'tl-bar-area';

    // グリッド線
    for (let t = Math.ceil(minSec / interval) * interval; t <= maxSec; t += interval) {
      const pct = (t - minSec) / totalSec * 100;
      const grid = document.createElement('div');
      grid.className = 'tl-grid-line';
      grid.style.left = pct + '%';
      barArea.appendChild(grid);
    }

    // 記録バー
    byDate[date].forEach(rec => {
      const s   = timeOfDaySecs(rec.startTime);
      const pct = (s - minSec) / totalSec * 100;
      const wPct = Math.max(0.3, rec.duration / totalSec * 100);

      const bar = document.createElement('div');
      bar.className = `tl-bar ${rec.state}`;
      bar.style.left  = pct + '%';
      bar.style.width = wPct + '%';

      // タップでポップアップ
      bar.addEventListener('click', e => {
        e.stopPropagation();
        showTlPopup(
          `${STATE_EMOJIS[rec.state]} ${STATE_LABELS[rec.state]}　` +
          `${formatTime(rec.startTime)} → ${secsToHMS(s + rec.duration)}　` +
          `（${rec.duration}秒）`
        );
      });
      barArea.appendChild(bar);
    });

    row.appendChild(label);
    row.appendChild(barArea);
    rowsDiv.appendChild(row);
  });

  body.appendChild(rowsDiv);

  // 現在時刻ライン（全行にまたがるオーバーレイ）
  renderNowLine(body, minSec, maxSec, totalSec);
  tlNowTimer = setInterval(() => renderNowLine(body, minSec, maxSec, totalSec), 10000);

  // 背景タップでポップアップを消す
  body.addEventListener('click', () => hideTlPopup(), { once: false });
}

function renderNowLine(body, minSec, maxSec, totalSec) {
  const old = body.querySelector('.tl-now-overlay');
  if (old) old.remove();

  const now = new Date();
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  if (nowSec < minSec || nowSec > maxSec) return;

  const pct = (nowSec - minSec) / totalSec * 100;

  // 軸ラベル位置にも"今"を描画
  const axisBarArea = body.querySelector('#tl-time-axis > div:last-child');
  if (axisBarArea) {
    const nowAxisLine = document.createElement('div');
    nowAxisLine.style.cssText = `position:absolute;top:0;bottom:0;width:2px;background:#fc8181;left:${pct}%;z-index:6;`;
    nowAxisLine.classList.add('tl-now-axis');
    axisBarArea.querySelectorAll('.tl-now-axis').forEach(el => el.remove());
    axisBarArea.appendChild(nowAxisLine);

    const nowAxisLabel = document.createElement('div');
    nowAxisLabel.style.cssText = `position:absolute;top:0;font-size:10px;color:#fc8181;font-weight:700;left:${pct}%;transform:translateX(-50%);white-space:nowrap;z-index:7;`;
    nowAxisLabel.textContent = secsToHM(nowSec);
    nowAxisLabel.classList.add('tl-now-axis');
    axisBarArea.appendChild(nowAxisLabel);
  }

  // データ行にオーバーレイ
  const rowsDiv = body.querySelector('.tl-rows');
  if (!rowsDiv) return;

  const overlay = document.createElement('div');
  overlay.className = 'tl-now-overlay';
  overlay.style.cssText = `position:absolute;pointer-events:none;z-index:4;`;

  // 各 barArea に縦線を描画
  rowsDiv.querySelectorAll('.tl-bar-area').forEach(ba => {
    const line = document.createElement('div');
    line.style.cssText = `position:absolute;top:0;bottom:0;width:2px;background:#fc8181;opacity:0.8;left:${pct}%;z-index:4;border-radius:1px;`;
    ba.querySelectorAll('.tl-now-bar-line').forEach(el => el.remove());
    line.classList.add('tl-now-bar-line');
    ba.appendChild(line);
  });
}

// =====================================================
//  タイムライン：ポップアップ
// =====================================================
let popupTimer = null;
function showTlPopup(msg) {
  const el = document.getElementById('tl-popup');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(popupTimer);
  popupTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
function hideTlPopup() {
  document.getElementById('tl-popup').classList.remove('show');
}

// =====================================================
//  信号機管理
// =====================================================
let deleteTargetId = null;

document.getElementById('manage-signals-btn').addEventListener('click', openManageModal);
document.getElementById('manage-close').addEventListener('click', () => {
  document.getElementById('manage-modal').classList.add('hidden');
});
document.getElementById('delete-cancel').addEventListener('click', () => {
  document.getElementById('delete-modal').classList.add('hidden');
  document.getElementById('manage-modal').classList.remove('hidden');
});
document.getElementById('delete-ok').addEventListener('click', async () => {
  const id = deleteTargetId;
  await DB_SIGNALS.removeItem(id);
  delete signals[id];
  const toDelete = [];
  await DB_RECORDS.iterate((v, k) => { if (v.signalId === id) toDelete.push(k); });
  await Promise.all(toDelete.map(k => DB_RECORDS.removeItem(k)));
  allRecords = allRecords.filter(r => r.signalId !== id);
  document.getElementById('delete-modal').classList.add('hidden');
  buildSignalFilters();
  applyFilters();
  openManageModal();
  showToast('削除しました');
});

async function openManageModal() {
  const list = document.getElementById('manage-list');
  list.innerHTML = '';

  const sigList = Object.values(signals).sort((a, b) => a.name.localeCompare(b.name, 'ja'));

  if (!sigList.length) {
    list.innerHTML = '<div style="text-align:center;color:#4a5568;padding:20px;font-size:14px;">信号機がありません</div>';
  } else {
    const counts = {};
    sigList.forEach(s => { counts[s.id] = 0; });
    allRecords.forEach(r => { if (counts[r.signalId] !== undefined) counts[r.signalId]++; });

    sigList.forEach(sig => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;padding:10px;background:#1a202c;border-radius:8px;margin-bottom:6px;gap:10px;';
      row.innerHTML = `
        <div style="flex:1;font-weight:600;font-size:14px;">${sig.name}</div>
        <div style="font-size:12px;color:#718096;">${counts[sig.id]}件</div>
        <button data-id="${sig.id}" data-name="${sig.name}" style="
          background:#e53e3e;border:none;border-radius:6px;
          color:#fff;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;
        ">削除</button>
      `;
      row.querySelector('button').addEventListener('click', e => {
        deleteTargetId = e.target.dataset.id;
        document.getElementById('delete-msg').textContent =
          `「${e.target.dataset.name}」と紐付く全記録（${counts[e.target.dataset.id]}件）を削除します。元に戻せません。`;
        document.getElementById('manage-modal').classList.add('hidden');
        document.getElementById('delete-modal').classList.remove('hidden');
      });
      list.appendChild(row);
    });
  }

  document.getElementById('manage-modal').classList.remove('hidden');
}

// =====================================================
//  CSVエクスポート
// =====================================================
document.getElementById('export-btn').addEventListener('click', () => {
  if (!filtered.length) { showToast('エクスポートするデータがありません'); return; }

  const header = ['日時','信号機名','状態','秒数','平日/休日','開始時刻','終了時刻'];
  const rows = filtered.map(r => {
    const sig = signals[r.signalId];
    return [
      formatDateTime(r.startTime),
      sig ? sig.name : '(削除済み)',
      STATE_LABELS[r.state] || r.state,
      r.duration,
      r.dayType === 'weekday' ? '平日' : '休日',
      r.startTime,
      r.endTime
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  });

  const csv  = '\uFEFF' + [header.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `signalmap_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`${filtered.length}件をCSVに出力しました`);
});

// =====================================================
//  起動
// =====================================================
loadData();
</script>
